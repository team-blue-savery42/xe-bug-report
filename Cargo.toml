# SPDX-License-Identifier: MIT
[package]
name = "xe-bug-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Standalone GPU diagnostic collector: writes a redacted zip bundle of logs, sysfs and tool output"
repository = "https://github.com/team-blue-savery42/xe-bug-report"
readme = "README.md"
publish = false

[lib]
name = "xe_bug_report"
path = "src/lib.rs"

[[bin]]
name = "xe-bug-report"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
crc32fast = "1.5.5"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
